        <h1>LocalMock — Free Mock Data &amp; Sample Data Generator</h1>
        <p>LocalMock is a free mock data generator, sample data generator, dummy data generator, and test data generator for developers, QA engineers, product teams, and AI assistants. It creates realistic fake data, random data, synthetic data, seed data, and API mock payloads entirely in the browser.</p>
        <p>Use LocalMock when you need CSV test data, JSON mock data, SQL insert data, JSONL files, MSW handlers, or TypeScript arrays. These exports fit tests, demos, prototypes, docs, API mocking, and local development workflows.</p>
        <p>The app supports manual fields, reusable templates, Prisma schemas, TypeScript types, JSON schemas, multi-table relational data, and chaos testing fields. These options help teams create realistic edge-case data without writing a new fixture script each time.</p>
        <p>Unlike server-first fake data generators or tools like Mockaroo, LocalMock keeps schemas and generated data on your device. This helps with private database models, customer-like sample datasets, API mocks, seed scripts, and repeatable QA workflows. There is no signup, no row limit, and no upload required.</p>
        <p>For AI-assisted work, LocalMock is better than asking a chat assistant to print thousands of rows. An assistant can help design the schema. LocalMock can then generate the large dataset locally and export it in the format you need.</p>
        <ul>
          <li>Generate private mock data, sample data, and dummy data in the browser.</li>
          <li>Export CSV, JSON, JSONL, SQL, MSW, and TypeScript data.</li>
          <li>Create relational mock data with foreign key integrity.</li>
          <li>Build fake users, products, orders, invoices, logs, events, addresses, support tickets, employees, and more.</li>
          <li>Use chaos testing options to produce nulls, formatting issues, broken encoding, and other realistic data problems.</li>
          <li>Free sample data generator with no row limits and no account needed.</li>
          <li>Works as a GenerateData alternative or Mockaroo alternative with a local-first approach.</li>
        </ul>
        <h2>Free sample data generator and dummy data generator</h2>
        <p>LocalMock is designed for practical software testing work. A developer can paste an existing schema, describe fields manually, or start from templates. Common templates include users, orders, products, invoices, server metrics, API logs, students, subscriptions, real estate listings, chat messages, comments, employees, and support tickets.</p>
        <p>The goal is to create realistic records quickly. You should not need a custom script for every mock dataset. LocalMock functions as both a dummy data generator for fast prototyping and a sophisticated test data generator for full QA workflows.</p>
        <p>Because generation happens client-side, LocalMock is useful when schemas contain private business names, internal fields, customer-like attributes, or app-specific table structures. The tool can produce a small preview for review. It can then export larger datasets for local files, fixture folders, seed commands, API mocks, or integration tests.</p>
        <h2>Schema-aware fake data generation and random test data</h2>
        <p>LocalMock supports schema-aware generation for teams that need more than random names and emails. Prisma, TypeScript, and JSON inputs can become structured test data fields. Manual editing gives direct control over field names, data types, uniqueness, and export shape.</p>
        <p>Multi-table generation helps preserve relationships between records. Orders can point to users, line items can point to products, and seed data can keep foreign keys consistent.</p>
        <p>The chaos engine is useful when applications must handle imperfect real-world data. It can introduce nulls, whitespace, broken encoding, casing problems, and other edge cases. This helps test validation, import pipelines, dashboards, and API clients before production users find the issue.</p>
        <h2>Exports for testing, demos, API mocks, and database seeding</h2>
        <p>LocalMock exports developer-friendly formats instead of locking data into one workflow. CSV works for spreadsheets and import tests. JSON and JSONL work for APIs and event streams. SQL inserts work for database seeding. MSW handlers support frontend API mocking. TypeScript arrays work well inside unit tests, Storybook stories, prototypes, and documentation examples.</p>
        <p>For AI assistants and coding agents, LocalMock provides a focused execution step. The assistant can help plan the schema and recommend fields. LocalMock handles bulk generation locally. That avoids wasting context on thousands of printed rows and gives the user a reusable interface for changing row counts, export formats, and data quality settings.</p>
