[package]
name = "localmock-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM engine for LocalMock hot loop: random number generation, string building, Luhn checksum"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = 3
lto = true
